<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sourcing Copilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f4f3; --surface:#ffffff; --ink:#15201d; --muted:#5a6a65; --line:#dde3e0; --accent:#3a41c6; --accent-ink:#ffffff; --soft:#e8ecea;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1514;--surface:#172120;--ink:#e7efec;--muted:#92a39d;--line:#2a3836;--accent:#9aa0ff;--accent-ink:#0f1514;--soft:#1e2b29;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1514;--surface:#172120;--ink:#e7efec;--muted:#92a39d;--line:#2a3836;--accent:#9aa0ff;--accent-ink:#0f1514;--soft:#1e2b29;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:8px}
.brand{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.tab{font:inherit;font-weight:500;border:1px solid transparent;background:none;color:var(--muted);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--soft)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab:focus-visible,.card-go:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{flex:1;min-height:0;position:relative}
.panel{position:absolute;inset:0}
.panel[hidden]{display:none}
iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.home{overflow:auto;padding-block:36px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home-in{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-family:var(--font-display);font-size:clamp(26px,5vw,36px);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lede{margin:8px 0 0;color:var(--muted);max-width:60ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-family:var(--font-display);font-size:20px;margin:0;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.step{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card-go{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 14px;cursor:pointer;align-self:flex-start}
.card-go:hover{filter:brightness(1.08)}
.note{font-size:13px;color:var(--muted);margin:0}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
@media (max-width:560px){.tab{padding:7px 10px;font-size:14px}.brand{width:100%}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <span class="brand">Sourcing Copilot</span>
    <div class="tabs" role="tablist" aria-label="Tools">
      <button class="tab" role="tab" id="t-copilot" data-tab="copilot" aria-selected="true" aria-controls="p-copilot">Copilot</button>
      <button class="tab" role="tab" id="t-links" data-tab="links" aria-selected="false" aria-controls="p-links">Link Builder</button>
      <button class="tab" role="tab" id="t-checker" data-tab="checker" aria-selected="false" aria-controls="p-checker">URL Checker</button>
      <button class="tab" role="tab" id="t-calibration" data-tab="calibration" aria-selected="false" aria-controls="p-calibration">Calibration Game</button>
      <button class="tab" role="tab" id="t-feed" data-tab="feed" aria-selected="false" aria-controls="p-feed">Approved Feed</button>
    </div>
  </div>
</header>
<main>
  
  <section class="panel" id="p-checker" role="tabpanel" aria-labelledby="t-checker" hidden></section>
  <section class="panel" id="p-calibration" role="tabpanel" aria-labelledby="t-calibration" hidden></section>
  <section class="panel" id="p-feed" role="tabpanel" aria-labelledby="t-feed" hidden></section>
  <section class="panel" id="p-links" role="tabpanel" aria-labelledby="t-links" hidden></section>
  <section class="panel" id="p-copilot" role="tabpanel" aria-labelledby="t-copilot"></section>
</main>

<script>
(function(){
  'use strict';
  var TABS=['copilot','links','checker','calibration','feed'], loaded={}, KEY='sourcing-copilot-suite-tab';
  function decode(id){
    var b=atob(document.getElementById('app-'+id).textContent.trim()), u=new Uint8Array(b.length);
    for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
    return new TextDecoder('utf-8').decode(u);
  }
  function mount(id){
    if(loaded[id])return;
    loaded[id]=true;
    var host=document.getElementById('p-'+id);
    var f=document.createElement('iframe');
    f.title={checker:'LinkedIn URL Checker',calibration:'Profile Calibration',feed:'Approved Profile Feed',links:'Company Link Builder',copilot:'Sourcing Copilot'}[id];
    f.setAttribute('allow','clipboard-write');
    f.srcdoc=decode(id);
    host.appendChild(f);
  }
  function show(id,push){
    if(TABS.indexOf(id)<0)id='copilot';
    TABS.forEach(function(t){
      var on=t===id;
      document.getElementById('p-'+t).hidden=!on;
      document.getElementById('t-'+t).setAttribute('aria-selected',String(on));
    });
    mount(id);
    var f=document.querySelector('#p-'+id+' iframe');
    if(f)setTimeout(function(){try{f.focus()}catch(e){}},50);
    if(push!==false&&location.hash!=='#'+id){try{history.replaceState(null,'','#'+id)}catch(e){location.hash=id}}
    document.title=(id==='copilot'?'':document.getElementById('t-'+id).textContent+' · ')+'Sourcing Copilot';
  }
  document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)show(b.dataset.tab)});
  document.querySelector('.tabs').addEventListener('keydown',function(e){
    if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
    var cur=TABS.indexOf(document.querySelector('.tab[aria-selected="true"]').dataset.tab),n=(cur+(e.key==='ArrowRight'?1:TABS.length-1))%TABS.length;
    show(TABS[n]);document.getElementById('t-'+TABS[n]).focus();
  });
  document.querySelector('.brand').addEventListener('click',function(){show('copilot')});
  window.addEventListener('hashchange',function(){show(location.hash.slice(1),false)});
  var start=location.hash.slice(1);
  if(TABS.indexOf(start)<0)start='copilot';
  show(start,false);
})();
</script>
