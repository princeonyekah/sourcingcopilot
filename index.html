<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sourcing Copilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f4f3; --surface:#ffffff; --ink:#15201d; --muted:#5a6a65; --line:#dde3e0; --accent:#3a41c6; --accent-ink:#ffffff; --soft:#e8ecea;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1514;--surface:#172120;--ink:#e7efec;--muted:#92a39d;--line:#2a3836;--accent:#9aa0ff;--accent-ink:#0f1514;--soft:#1e2b29;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1514;--surface:#172120;--ink:#e7efec;--muted:#92a39d;--line:#2a3836;--accent:#9aa0ff;--accent-ink:#0f1514;--soft:#1e2b29;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:8px}
.brand{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.tab{font:inherit;font-weight:500;border:1px solid transparent;background:none;color:var(--muted);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--soft)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab:focus-visible,.card-go:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{flex:1;min-height:0;position:relative}
.panel{position:absolute;inset:0}
.panel[hidden]{display:none}
iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.home{overflow:auto;padding-block:36px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home-in{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-family:var(--font-display);font-size:clamp(26px,5vw,36px);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lede{margin:8px 0 0;color:var(--muted);max-width:60ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-family:var(--font-display);font-size:20px;margin:0;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.step{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card-go{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 14px;cursor:pointer;align-self:flex-start}
.card-go:hover{filter:brightness(1.08)}
.note{font-size:13px;color:var(--muted);margin:0}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
@media (max-width:560px){.tab{padding:7px 10px;font-size:14px}.brand{width:100%}}

.keybtn{margin-left:auto;font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.keybtn:hover{border-color:var(--muted)}
.keybtn:focus-visible,.kmodal button:focus-visible,.kmodal input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dot{width:9px;height:9px;border-radius:50%;background:#c98a00}.keybtn.on .dot{background:#2a9d62}
.kmodal[hidden]{display:none}
.kmodal{position:fixed;inset:0;z-index:50;background:rgba(10,15,14,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.ksheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:480px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px}
.ksheet h2{margin:0;font-family:var(--font-display);font-size:19px}
.ksheet input[type=password],.ksheet input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.krow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ksheet button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.ksheet button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ksheet button.danger{color:#a3441a}
.kmsg{font-size:13px;min-height:18px}
@media (max-width:560px){.keybtn{margin-left:0}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <span class="brand">Sourcing Copilot</span>
    <div class="tabs" role="tablist" aria-label="Tools">
      <button class="tab" role="tab" id="t-copilot" data-tab="copilot" aria-selected="true" aria-controls="p-copilot">Copilot</button>
      <button class="tab" role="tab" id="t-links" data-tab="links" aria-selected="false" aria-controls="p-links">Link Builder</button>
      <button class="tab" role="tab" id="t-checker" data-tab="checker" aria-selected="false" aria-controls="p-checker">URL Checker</button>
      <button class="tab" role="tab" id="t-calibration" data-tab="calibration" aria-selected="false" aria-controls="p-calibration">Calibration Game</button>
      <button class="tab" role="tab" id="t-feed" data-tab="feed" aria-selected="false" aria-controls="p-feed">Approved Feed</button>
    </div>
    <button type="button" class="keybtn" id="keybtn" aria-haspopup="dialog"><span class="dot"></span><span id="keylbl">API key</span></button>
  </div>
</header>
<div class="kmodal" id="kmodal" hidden role="dialog" aria-modal="true" aria-labelledby="ktitle">
  <div class="ksheet">
    <h2 id="ktitle">Claude API key</h2>
    <p class="note" style="margin:0">Add it once. Copilot and the Link Builder both use it. It stays in this browser and is sent only to Anthropic.</p>
    <input type="password" id="kinput" autocomplete="off" spellcheck="false" placeholder="sk-ant-..." aria-label="Claude API key">
    <div class="krow"><label class="krow" style="gap:6px"><input type="checkbox" id="kshow"> Show</label><label class="krow" style="gap:6px"><input type="checkbox" id="kremember"> Remember on this device</label></div>
    <div class="kmsg" id="kmsg" aria-live="polite"></div>
    <div class="krow"><button type="button" class="primary" id="ksave">Save key</button><button type="button" id="ktest">Test key</button><button type="button" class="danger" id="kforget">Remove</button><span style="flex:1"></span><button type="button" id="kclose">Close</button></div>
  </div>
</div>
<main>
  
  <section class="panel" id="p-checker" role="tabpanel" aria-labelledby="t-checker" hidden></section>
  <section class="panel" id="p-calibration" role="tabpanel" aria-labelledby="t-calibration" hidden></section>
  <section class="panel" id="p-feed" role="tabpanel" aria-labelledby="t-feed" hidden></section>
  <section class="panel" id="p-links" role="tabpanel" aria-labelledby="t-links" hidden></section>
  <section class="panel" id="p-copilot" role="tabpanel" aria-labelledby="t-copilot"></section>
</main>

<script>
(function(){
  'use strict';
  /* One place for the Claude API key. Copilot reads the same storage name, and the tools call this hub. */
  var KKEY='sourcing-copilot-key';
  function lget(){try{return localStorage.getItem(KKEY)||''}catch(e){return ''}}
  function sget(){try{return sessionStorage.getItem(KKEY)||''}catch(e){return ''}}
  function getKey(){return (sget()||lget()).trim()}
  function setKey(k,remember){
    try{localStorage.removeItem(KKEY)}catch(e){} try{sessionStorage.removeItem(KKEY)}catch(e){}
    if(!k)return;
    try{(remember?localStorage:sessionStorage).setItem(KKEY,k)}catch(e){}
  }
  function notify(){
    Array.prototype.forEach.call(document.querySelectorAll('iframe'),function(f){try{f.contentWindow.dispatchEvent(new Event('sc-key'))}catch(e){}});
    var has=!!getKey(),b=document.getElementById('keybtn');b.classList.toggle('on',has);document.getElementById('keylbl').textContent=has?'API key set':'Add API key';
  }
  var km=document.getElementById('kmodal'),ki=document.getElementById('kinput'),kmsg=document.getElementById('kmsg'),lastFocus=null;
  function openKey(){lastFocus=document.activeElement;ki.value=getKey();ki.type='text';ki.type='password';document.getElementById('kshow').checked=false;document.getElementById('kremember').checked=!!lget();kmsg.textContent='';km.hidden=false;ki.focus()}
  function closeKey(){km.hidden=true;try{lastFocus&&lastFocus.focus()}catch(e){}}
  window.__SC_HUB={openKey:openKey,getKey:getKey};
  document.getElementById('keybtn').addEventListener('click',openKey);
  document.getElementById('kclose').addEventListener('click',closeKey);
  km.addEventListener('click',function(e){if(e.target===km)closeKey()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!km.hidden)closeKey()});
  document.getElementById('kshow').addEventListener('change',function(e){ki.type=e.target.checked?'text':'password'});
  document.getElementById('ksave').addEventListener('click',function(){
    var k=ki.value.trim();setKey(k,document.getElementById('kremember').checked);notify();
    if(k){closeKey()}else kmsg.textContent='Key removed.';
  });
  document.getElementById('kforget').addEventListener('click',function(){ki.value='';setKey('',false);notify();kmsg.textContent='Key removed from this browser.'});
  document.getElementById('ktest').addEventListener('click',function(){
    var k=ki.value.trim();if(!k){kmsg.textContent='Enter a key first.';return}
    kmsg.textContent='Testing...';
    fetch('https://api.anthropic.com/v1/models?limit=1',{headers:{'x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}})
      .then(function(r){kmsg.textContent=r.ok?'Key works.':(r.status===401?'That key was not accepted.':'Anthropic returned an error ('+r.status+').')})
      .catch(function(){kmsg.textContent='Could not reach Anthropic. Check your connection.'});
  });
  var TABS=['copilot','links','checker','calibration','feed'], loaded={}, KEY='sourcing-copilot-suite-tab';
  function decode(id){
    var b=atob(document.getElementById('app-'+id).textContent.trim()), u=new Uint8Array(b.length);
    for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
    return new TextDecoder('utf-8').decode(u);
  }
  function mount(id){
    if(loaded[id])return;
    loaded[id]=true;
    var host=document.getElementById('p-'+id);
    var f=document.createElement('iframe');
    f.title={checker:'LinkedIn URL Checker',calibration:'Profile Calibration',feed:'Approved Profile Feed',links:'Company Link Builder',copilot:'Sourcing Copilot'}[id];
    f.setAttribute('allow','clipboard-write');
    f.srcdoc=decode(id);
    host.appendChild(f);
  }
  function show(id,push){
    if(TABS.indexOf(id)<0)id='copilot';
    TABS.forEach(function(t){
      var on=t===id;
      document.getElementById('p-'+t).hidden=!on;
      document.getElementById('t-'+t).setAttribute('aria-selected',String(on));
    });
    mount(id);
    var f=document.querySelector('#p-'+id+' iframe');
    if(f)setTimeout(function(){try{f.focus()}catch(e){}},50);
    if(push!==false&&location.hash!=='#'+id){try{history.replaceState(null,'','#'+id)}catch(e){location.hash=id}}
    document.title=(id==='copilot'?'':document.getElementById('t-'+id).textContent+' · ')+'Sourcing Copilot';
  }
  document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)show(b.dataset.tab)});
  document.querySelector('.tabs').addEventListener('keydown',function(e){
    if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
    var cur=TABS.indexOf(document.querySelector('.tab[aria-selected="true"]').dataset.tab),n=(cur+(e.key==='ArrowRight'?1:TABS.length-1))%TABS.length;
    show(TABS[n]);document.getElementById('t-'+TABS[n]).focus();
  });
  document.querySelector('.brand').addEventListener('click',function(){show('copilot')});
  window.addEventListener('hashchange',function(){show(location.hash.slice(1),false)});
  var start=location.hash.slice(1);
  if(TABS.indexOf(start)<0)start='copilot';
  show(start,false);
  notify();
})();
</script>
